<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0f1117">
  <title>DSH</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div id="app">
    <!-- 连接状态条 -->
    <div id="netbar" class="netbar hidden">…</div>

    <!-- 主视图容器 -->
    <main id="view" class="view"></main>

    <!-- 底部标签栏 -->
    <nav id="tabbar" class="tabbar hidden">
      <button class="tab" data-route="sessions"><span class="tab-ico">💬</span><span class="tab-lbl" data-i18n="tab.sessions">会话</span></button>
      <button class="tab" data-route="plugins"><span class="tab-ico">🧩</span><span class="tab-lbl" data-i18n="tab.plugins">插件</span></button>
      <button class="tab" data-route="settings"><span class="tab-ico">⚙️</span><span class="tab-lbl" data-i18n="tab.settings">设置</span></button>
    </nav>
  </div>

  <!-- 轻提示 -->
  <div id="toast" class="toast hidden"></div>

  <!-- 底部动作面板（会话操作等） -->
  <div id="sheet" class="sheet-mask hidden">
    <div class="sheet">
      <div id="sheetTitle" class="sheet-title"></div>
      <div id="sheetBody"></div>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
